name: Weekly projections

# Tuesday morning, after Monday night football has settled into the data.
# A second run on Friday and Sunday catches injury designations and inactives.
on:
  schedule:
    - cron: "0 13 * * 2"
    - cron: "0 16 * * 5"
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      from_week:
        description: "First week to project"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore nflverse cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Work out the upcoming week
        id: week
        run: |
          if [ -n "${{ inputs.from_week }}" ]; then
            echo "value=${{ inputs.from_week }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(python -m pipeline.current_week)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build projections
        run: python -m pipeline.project --source nflverse --from-week ${{ steps.week.outputs.value }}

      # What the site showed for this week, kept for the scorecard to grade.
      - name: Archive this week's projections
        run: |
          mkdir -p web/data/history
          cp web/data/projections.json "web/data/history/week-${{ steps.week.outputs.value }}.json"

      # What another site said about the same week, kept before the games are
      # played. Reading it back afterwards cannot prove what it said at the
      # time, and the weekly report makes a claim about exactly that.
      - name: Capture Sleeper's projections
        run: |
          python -m tools.sleeper_snapshot --week ${{ steps.week.outputs.value }} \
            || echo "Sleeper unavailable; the report will say the numbers were read back later"

      # Every archived week that has now been played is graded against the
      # experts before the pages that show the scorecard are built.
      - name: Grade past weeks
        run: python -m pipeline.scorecard

      # Last week's games are done by now, so it gets its report, written
      # before the pages are built so the same run publishes it.
      - name: Write last week's report
        run: |
          last=$(( ${{ steps.week.outputs.value }} - 1 ))
          if [ "$last" -ge 1 ]; then
            python -m pipeline.report --week "$last" \
              || echo "week $last is not ready to grade yet"
          fi

      # Rankings, waiver, scorecard and model-vs-experts pages that search
      # engines can index, from the projections just built.
      - name: Build search pages
        run: python -m pipeline.pages

      - name: Commit
        run: |
          git config user.name  "projections-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web
          git diff --staged --quiet || git commit -m "Projections and pages for week ${{ steps.week.outputs.value }}"
          git push

      # Only once the pages are published: IndexNow is an invitation to come
      # and read them, so it has to point at what is actually there. Pages
      # takes a moment to go live after the push, hence the wait, and a failed
      # ping is not worth failing the build over.
      - name: Tell Bing what changed
        run: |
          sleep 90
          python -m tools.indexnow || echo "IndexNow ping did not go through; the pages will be crawled anyway"
